[build]
  publish = "public"

# Spring renders the frontend and handles its forms on EC2.
# Keep page, form, asset, and API requests on the same Netlify origin.
[[redirects]]
  from = "/*"
  to = "http://realestate-backend-prod.eba-kjmtmh2m.us-east-1.elasticbeanstalk.com/:splat"
  status = 200
  force = true
  headers = { X-Forwarded-Host = "realestate-gokul-20261008.netlify.app", X-Forwarded-Proto = "https", X-Forwarded-Port = "443" }
