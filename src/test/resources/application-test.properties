# Optional local test credentials (ignored by Git)
spring.config.import=optional:file:.local/application-test.properties

# Dedicated MySQL test database; never point this at development or production.
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_backend_test
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:root123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recreate the schema for each test application context
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Placeholder credentials; upload calls are mocked
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
