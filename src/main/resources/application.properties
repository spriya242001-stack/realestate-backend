spring.application.name=realestate_backend
spring.profiles.default=dev

# Runtime credentials come from environment variables or ignored local overrides.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/realestate_backend_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.port=${PORT:5000}

# Development can generate a startup key; production requires JWT_SECRET.
security.jwt.secret=${JWT_SECRET:}
