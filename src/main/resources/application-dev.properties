# Local credentials live outside the packaged application.
spring.config.import=optional:file:.local/application.properties

server.port=${PORT:8081}

# Development database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/realestate_backend_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The imported local file can override these settings, including credentials.

# Development schema and SQL diagnostics
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
