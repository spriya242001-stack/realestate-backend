<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Login - Real Estate Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css.css}">
    <script th:src="@{/js.js}" defer></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded shadow-md w-full max-w-md">
  <h2 class="text-2xl font-bold mb-6 text-center">Login to Your Account</h2>

  <div th:if="${param.registered}" class="bg-green-100 text-green-700 p-2 rounded mb-4 text-center">
    Registration successful! Please log in.
  </div>
  <div th:if="${param.error}" class="bg-red-100 text-red-700 p-2 rounded mb-4 text-center">
    Invalid username or password.
  </div>
  <div th:if="${param.logout}" class="bg-blue-100 text-blue-700 p-2 rounded mb-4 text-center">
    You have been logged out.
  </div>

  <form th:action="@{/login}" method="post" >
    <div>
      <label class="block font-semibold">Email</label>
      <input type="email" name="username" class="w-full border p-2 rounded" required />
    </div>
    <div>
      <label class="block font-semibold">Password</label>
      <input type="password" name="password" class="w-full border p-2 rounded" required />
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Login</button>
  </form>
  <p class="mt-4 text-center text-sm">
    Don't have an account? <a href="/register" class="text-blue-600 underline">Register here</a>.
  </p>
</div>
</body>
</html>
