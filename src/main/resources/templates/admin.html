<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css.css}">
    <script th:src="@{/js.js}" defer></script>
</head>
<body>
<h1>Admin Dashboard</h1>
<a th:href="@{/}">Home</a>

<p th:if="${param.approved}" role="status">Property approved.</p>
<p th:if="${param.userDeleted}" role="status">User deleted.</p>
<h2>Pending Properties</h2>
<div th:if="${#lists.isEmpty(pendingProperties)}">No pending properties.</div>
<div th:each="property : ${pendingProperties}">
    <h3 th:text="${property.title}">Property</h3>
    <p th:text="${property.location}">Location</p>

    <form th:action="@{'/admin/approve/' + ${property.id}}" method="post">
        <button type="submit">Approve</button>
    </form>
</div>

<h2>Users</h2>
<div th:each="user : ${users}">
    <span th:text="${user.name}">Name</span>
    <span th:text="${user.email}">Email</span>
    <span th:text="${user.role}">Role</span>
    <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post"
          data-confirm="Delete this user and all of their property listings?">
        <button type="submit">Delete user</button>
    </form>
</div>
</body>
</html>
